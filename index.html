<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b0124f">
<title>Shyam &amp; Saloni | Wedding Invitation</title>
<meta name="description" content="You're invited to celebrate with Shyam & Saloni on 15th November 2026">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@600;700&family=Pinyon+Script&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-locked">

<!-- Shared SVG art: roses, leaves, gradients -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="roseGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#e2405d"/>
      <stop offset=".55" stop-color="#bf1b3c"/>
      <stop offset="1" stop-color="#7d0c25"/>
    </radialGradient>
    <radialGradient id="roseGradPink" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f590a6"/>
      <stop offset=".6" stop-color="#e25579"/>
      <stop offset="1" stop-color="#b22a52"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d9a4e"/>
      <stop offset="1" stop-color="#2f6431"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6223"/>
      <stop offset=".35" stop-color="#e3b25c"/>
      <stop offset=".6" stop-color="#c58a35"/>
      <stop offset="1" stop-color="#7d4b18"/>
    </linearGradient>

    <symbol id="rose" viewBox="-20 -20 40 40">
      <circle r="18.5" fill="url(#roseGrad)"/>
      <path d="M-15-6C-12-15 0-19 9-15 16-11 18-2 15 6 11 14 1 17-7 15-15 12-18 2-15-6Z" fill="#c82242" opacity=".85"/>
      <path d="M-11 1C-12-8-4-13 4-11 11-9 13-1 10 5 7 11-1 12-6 9" fill="none" stroke="#6e0a20" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-5-1C-4-7 3-8 6-3 8 1 5 6 0 5-3 4-4 1-2-1" fill="none" stroke="#6e0a20" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-16 3C-13 13-3 18 7 16" fill="none" stroke="#e8607a" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
      <path d="M-8-15C0-19 10-16 14-9" fill="none" stroke="#ef7189" stroke-width="1" stroke-linecap="round" opacity=".7"/>
      <circle r="2.4" fill="#5c071a"/>
    </symbol>

    <symbol id="rosePink" viewBox="-20 -20 40 40">
      <circle r="18.5" fill="url(#roseGradPink)"/>
      <path d="M-11 1C-12-8-4-13 4-11 11-9 13-1 10 5 7 11-1 12-6 9" fill="none" stroke="#a11d45" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-5-1C-4-7 3-8 6-3 8 1 5 6 0 5-3 4-4 1-2-1" fill="none" stroke="#a11d45" stroke-width="1.4" stroke-linecap="round"/>
      <circle r="2.2" fill="#8c1538"/>
    </symbol>

    <symbol id="bud" viewBox="-8 -12 16 24">
      <path d="M0-11C6-6 6 3 0 6-6 3-6-6 0-11Z" fill="#b8173a"/>
      <path d="M-5 3C-3 9 3 9 5 3 3 6-3 6-5 3Z" fill="#3f7a3a"/>
    </symbol>

    <symbol id="leaf" viewBox="0 -8 26 16">
      <path d="M0 0C7-8 18-8 26 0 18 8 7 8 0 0Z" fill="url(#leafGrad)"/>
      <path d="M1 0H24" stroke="#24502a" stroke-width=".8" opacity=".7"/>
    </symbol>

    <symbol id="whiteFlower" viewBox="-6 -6 12 12">
      <g fill="#fffdf6" stroke="#e6dccb" stroke-width=".4">
        <ellipse cx="0" cy="-3" rx="2" ry="3"/>
        <ellipse cx="0" cy="3" rx="2" ry="3"/>
        <ellipse cx="-3" cy="0" rx="3" ry="2"/>
        <ellipse cx="3" cy="0" rx="3" ry="2"/>
      </g>
      <circle r="1.3" fill="#f2c94c"/>
    </symbol>

    <!-- Embossed rose for the envelope (single-tone, depth comes from shadows).
         Petals are generated by script.js -> buildEmbossRose(). -->
    <symbol id="embossRose" viewBox="-70 -70 140 140" overflow="visible">
      <g id="embossRoseArt" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
    </symbol>

    <pattern id="embossPattern" width="280" height="300" patternUnits="userSpaceOnUse">
      <use href="#embossRose" x="0" y="0" width="160" height="160"/>
      <use href="#embossRose" x="140" y="140" width="150" height="150" transform="rotate(130 215 215)"/>
      <use href="#embossRose" x="-140" y="140" width="150" height="150" transform="rotate(130 -65 215)"/>
      <use href="#embossRose" x="140" y="-160" width="150" height="150" transform="rotate(130 215 -85)"/>
      <use href="#embossRose" x="0" y="300" width="160" height="160"/>
      <use href="#embossRose" x="280" y="0" width="160" height="160"/>
    </pattern>
  </defs>
</svg>

<!-- ===================== COVER / ENVELOPE ===================== -->
<section id="cover" class="cover" aria-label="Wedding invitation envelope">
  <div class="env-flap env-flap-left" aria-hidden="true">
    <svg class="env-emboss"><rect width="100%" height="100%" fill="url(#embossPattern)"/></svg>
  </div>
  <div class="env-flap env-flap-right" aria-hidden="true">
    <svg class="env-emboss"><rect width="100%" height="100%" fill="url(#embossPattern)"/></svg>
  </div>
  <div class="env-flap env-flap-bottom" aria-hidden="true">
    <svg class="env-emboss faint"><rect width="100%" height="100%" fill="url(#embossPattern)"/></svg>
  </div>
  <div class="env-flap env-flap-top" aria-hidden="true"></div>

  <svg class="env-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 0L50 42L100 0M0 100L50 42L100 100" vector-effect="non-scaling-stroke"/>
  </svg>

  <canvas id="sparkleCanvas" class="sparkle-canvas" aria-hidden="true"></canvas>

  <button id="sealBtn" class="seal" aria-label="Tap on the seal to open the invitation">
    <svg class="seal-wax" viewBox="-110 -110 220 220" aria-hidden="true">
      <defs>
        <radialGradient id="waxGrad" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#fde3e6"/>
          <stop offset=".55" stop-color="#f4bfc7"/>
          <stop offset="1" stop-color="#e09aa8"/>
        </radialGradient>
        <radialGradient id="waxInner" cx="45%" cy="40%" r="60%">
          <stop offset="0" stop-color="#fbd5da"/>
          <stop offset="1" stop-color="#eeb0bb"/>
        </radialGradient>
      </defs>
      <path id="waxBlob" fill="url(#waxGrad)"/>
      <circle r="72" fill="url(#waxInner)"/>
      <circle r="72" fill="none" stroke="#c97f8f" stroke-width="2.5" opacity=".55"/>
      <circle r="74.5" fill="none" stroke="#fff4f5" stroke-width="2" opacity=".8"/>
      <circle r="64" fill="none" stroke="#d48b9a" stroke-width="1" opacity=".5"/>
    </svg>
    <img class="seal-logo" src="assets/images/ss-logo-wax.png" alt="">
  </button>

  <p class="cover-hint" id="coverHint"><span>Click on seal</span><i></i><span>to open the invitation</span></p>
</section>

<!-- ===================== MAIN ===================== -->
<main id="main" class="main" aria-hidden="true">

  <!-- Invitation -->
  <section class="invite reveal" aria-label="Invitation">
    <svg class="invite-art" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="openingGlow" cx="50%" cy="45%" r="60%">
          <stop offset="0" stop-color="#fffaf1"/>
          <stop offset="1" stop-color="#f6e6d0"/>
        </radialGradient>
        <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f1dcc0"/>
          <stop offset="1" stop-color="#e6c9a5"/>
        </linearGradient>
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#efe2d4"/>
          <stop offset="1" stop-color="#f8efe6"/>
        </linearGradient>
        <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c79a4f"/>
          <stop offset=".5" stop-color="#ead08f"/>
          <stop offset="1" stop-color="#b8863c"/>
        </linearGradient>
      </defs>

      <rect width="600" height="900" fill="url(#openingGlow)"/>

      <!-- arch frame + pillars -->
      <path fill="url(#stoneGrad)" fill-rule="evenodd"
            d="M0 0H600V770H0Z M84 770V300C84 196 190 118 300 64 410 118 516 196 516 300V770Z"/>
      <path d="M84 770V300C84 196 190 118 300 64 410 118 516 196 516 300V770" fill="none" stroke="url(#goldLine)" stroke-width="3"/>
      <path d="M98 770V304C98 208 196 136 300 84 404 136 502 208 502 304V770" fill="none" stroke="#d8b98a" stroke-width="1.2"/>
      <g fill="none" stroke="#cfae80" stroke-width="1.2" opacity=".9">
        <rect x="18" y="330" width="52" height="120" rx="3"/>
        <rect x="26" y="340" width="36" height="100" rx="18"/>
        <rect x="18" y="470" width="52" height="120" rx="3"/>
        <rect x="26" y="480" width="36" height="100" rx="18"/>
        <rect x="18" y="610" width="52" height="120" rx="3"/>
        <rect x="530" y="330" width="52" height="120" rx="3"/>
        <rect x="538" y="340" width="36" height="100" rx="18"/>
        <rect x="530" y="470" width="52" height="120" rx="3"/>
        <rect x="538" y="480" width="36" height="100" rx="18"/>
        <rect x="530" y="610" width="52" height="120" rx="3"/>
        <path d="M10 312H80M520 312H590M10 600H80M520 600H590"/>
      </g>
      <g fill="#e7cfaa" stroke="#c9a676" stroke-width="1">
        <rect x="6" y="756" width="86" height="16"/>
        <rect x="508" y="756" width="86" height="16"/>
      </g>

      <!-- gold filigree on the right pillar -->
      <g transform="translate(58 -40) scale(.92)">
      <g class="filigree" fill="none" stroke="url(#goldLine)" stroke-width="2" stroke-linecap="round">
        <path d="M520 700C500 640 512 590 492 540 476 500 488 470 470 440"/>
        <path d="M507 640C522 626 530 610 528 594M500 590C484 580 478 566 480 550M494 520C510 510 516 496 512 482"/>
      </g>
      <g fill="#e2c07a">
        <ellipse cx="528" cy="594" rx="6" ry="3" transform="rotate(-60 528 594)"/>
        <ellipse cx="480" cy="550" rx="6" ry="3" transform="rotate(70 480 550)"/>
        <ellipse cx="512" cy="482" rx="6" ry="3" transform="rotate(-70 512 482)"/>
        <ellipse cx="470" cy="440" rx="6" ry="3" transform="rotate(60 470 440)"/>
      </g>
      </g>

      <!-- marble floor -->
      <path d="M0 770H600V900H0Z" fill="#eadbc8"/>
      <path d="M200 770H400L500 900H100Z" fill="url(#floorGrad)" stroke="#dcc4a8"/>
      <ellipse cx="300" cy="830" rx="84" ry="20" fill="none" stroke="#d29a9f" stroke-width="2"/>
      <ellipse cx="300" cy="830" rx="58" ry="13" fill="none" stroke="#c7a37a" stroke-width="1.4"/>
      <ellipse cx="300" cy="830" rx="22" ry="6" fill="#e6b3b6"/>
      <path d="M216 830H384M300 812V848" stroke="#d6b28e" stroke-width="1" opacity=".7"/>
      <ellipse cx="300" cy="880" rx="40" ry="8" fill="none" stroke="#d29a9f" stroke-width="1.4"/>
      <ellipse cx="300" cy="790" rx="30" ry="6" fill="none" stroke="#d29a9f" stroke-width="1.2"/>

      <!-- candles -->
      <g class="candles">
        <rect x="150" y="826" width="12" height="40" rx="2" fill="#fbf4e8" stroke="#e2d2bb"/>
        <rect x="168" y="842" width="12" height="26" rx="2" fill="#fbf4e8" stroke="#e2d2bb"/>
        <rect x="420" y="834" width="12" height="34" rx="2" fill="#fbf4e8" stroke="#e2d2bb"/>
        <rect x="438" y="846" width="12" height="22" rx="2" fill="#fbf4e8" stroke="#e2d2bb"/>
        <g class="flame" fill="#ffbf47">
          <path d="M156 824C152 816 156 810 156 806 160 812 161 818 156 824Z"/>
          <path d="M174 840C170 832 174 826 174 822 178 828 179 834 174 840Z"/>
          <path d="M426 832C422 824 426 818 426 814 430 820 431 826 426 832Z"/>
          <path d="M444 844C440 836 444 830 444 826 448 832 449 838 444 844Z"/>
        </g>
      </g>

      <!-- plants in brass pots (filled by JS) -->
      <g id="potLeft" class="pot"></g>
      <g id="potRight" class="pot"></g>

      <!-- rose garland (filled by JS) -->
      <g id="garland"></g>
    </svg>

    <div class="invite-text">
      <img class="ganesh" src="assets/images/ganesh.png" alt="Shri Ganesh">
      <div class="shloka" data-bind-lines="shloka"></div>
      <p class="caps invite-line" data-bind="inviteLine1"></p>
      <p class="caps invite-line" data-bind="inviteLine2"></p>
      <p class="caps occasion" data-bind="occasion"></p>
      <h1 class="name" data-bind="couple.bride"></h1>
      <p class="caps parents">D/O <span data-bind="families.brideParents"></span></p>
      <p class="grandparents">(Granddaughter of <span data-bind="families.brideGrandparents"></span>)</p>
      <p class="caps with">with</p>
      <h1 class="name" data-bind="couple.groom"></h1>
      <p class="caps parents">S/O <span data-bind="families.groomParents"></span></p>
      <p class="grandparents">(Grandson of <span data-bind="families.groomGrandparents"></span>)</p>
    </div>
  </section>

  <!-- Our Beautiful Moments -->
  <section class="moments reveal" aria-label="Our beautiful moments">
    <p class="caps eyebrow">A Glimpse Of Us</p>
    <h2 class="script-title">Our Beautiful Moments</h2>
    <div class="gallery">
      <div class="gallery-viewport" id="galleryViewport">
        <div class="gallery-track" id="galleryTrack"></div>
      </div>
      <div class="gallery-dots" id="galleryDots"></div>
    </div>
  </section>

  <!-- Save the date -->
  <section class="parchment torn reveal" aria-label="Save the date">
    <h2 class="script-title">Save the Date</h2>
    <p class="caps sub" data-bind="saveTheDateLine"></p>
    <div class="hearts">
      <div class="heart"><svg viewBox="0 0 100 90" aria-hidden="true"><path d="M50 84C20 62 4 46 4 27 4 13 15 4 28 4 38 4 46 10 50 18 54 10 62 4 72 4 85 4 96 13 96 27 96 46 80 62 50 84Z"/></svg><span data-bind="saveTheDate.day"></span></div>
      <div class="heart"><svg viewBox="0 0 100 90" aria-hidden="true"><path d="M50 84C20 62 4 46 4 27 4 13 15 4 28 4 38 4 46 10 50 18 54 10 62 4 72 4 85 4 96 13 96 27 96 46 80 62 50 84Z"/></svg><span data-bind="saveTheDate.month"></span></div>
      <div class="heart"><svg viewBox="0 0 100 90" aria-hidden="true"><path d="M50 84C20 62 4 46 4 27 4 13 15 4 28 4 38 4 46 10 50 18 54 10 62 4 72 4 85 4 96 13 96 27 96 46 80 62 50 84Z"/></svg><span data-bind="saveTheDate.year"></span></div>
    </div>
  </section>

  <!-- Countdown -->
  <section class="countdown reveal" aria-label="Countdown">
    <h2 class="script-title">The celebration begins in</h2>
    <div class="cd-grid">
      <div class="cd-box"><b id="cdDays">00</b><small>Days</small></div>
      <div class="cd-box"><b id="cdHours">00</b><small>Hours</small></div>
      <div class="cd-box"><b id="cdMins">00</b><small>Minutes</small></div>
      <div class="cd-box"><b id="cdSecs">00</b><small>Seconds</small></div>
    </div>
  </section>

  <!-- Venue -->
  <section class="venue reveal" aria-label="Venue">
    <p class="caps venue-intro" data-bind="venue.intro"></p>
    <h2 class="script-title big">We're celebrating at</h2>

    <svg class="venue-art" viewBox="0 0 600 360" aria-hidden="true">
      <defs>
        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f0c27a"/>
          <stop offset="1" stop-color="#d79c52"/>
        </linearGradient>
        <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e2ae66"/>
          <stop offset="1" stop-color="#c3843f"/>
        </linearGradient>
        <radialGradient id="venueFade" cx="50%" cy="42%" r="62%">
          <stop offset=".72" stop-color="#fff"/>
          <stop offset="1" stop-color="#000"/>
        </radialGradient>
        <mask id="venueMask"><rect width="600" height="360" fill="url(#venueFade)"/></mask>
      </defs>
      <g mask="url(#venueMask)" id="fort"></g>
    </svg>

    <h3 class="venue-name caps" data-bind="venue.name"></h3>
    <p class="caps venue-address" data-bind="venue.address"></p>
    <div class="dots" aria-hidden="true">✦ ✦ ✦</div>
    <a id="directionsBtn" class="btn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
      Find your way
      <span aria-hidden="true">›</span>
    </a>
    <p class="caps venue-date" data-bind="dateDisplay"></p>
  </section>

  <!-- Closing -->
  <section class="closing reveal" aria-label="With love">
    <img class="closing-logo" src="assets/images/ss-logo-gold.png" alt="Shyam &amp; Saloni monogram">
    <p class="closing-msg" data-bind="closing.message"></p>
    <div class="rsvp">
      <p class="rsvp-title" data-bind="rsvp.title"></p>
      <ul class="rsvp-names" id="rsvpNames"></ul>
    </div>
    <p class="caps tiny">With love &amp; warmest wishes</p>
    <p class="family" data-bind="families.signOff"></p>
    <p class="family-note" data-bind="families.signOffNote"></p>
    <p class="closing-tag" data-bind="closing.tagline"></p>
  </section>

  <footer class="rose-border" aria-hidden="true">
    <svg viewBox="0 0 600 170" preserveAspectRatio="xMidYMax slice"><g id="roseBorder"></g></svg>
  </footer>
</main>

<canvas id="petalCanvas" class="petal-canvas" aria-hidden="true"></canvas>

<button id="audioToggle" class="audio-toggle" aria-label="Mute music" hidden>
  <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm17.7 6.3-1.4 1.4L17.6 14l-2.7 2.7-1.4-1.4 2.7-2.7-2.7-2.7 1.4-1.4 2.7 2.7 2.7-2.7 1.4 1.4-2.7 2.7 2.7 2.7Z"/></svg>
</button>
<audio id="bgAudio" loop preload="auto"></audio>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
